name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build test image
      run: docker build --target test -t geocode-api:test .

    - name: Run test suite in Docker
      run: docker run --rm geocode-api:test
